[project]
name = "vulnhound"
version = "0.1.0"
description = "AI-driven vulnerability hunting with full traffic audit"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = [
    "e2e: real end-to-end against DVWA (needs LLM_API_KEY, docker image vh-agent, live target)",
]

[tool.ruff]
line-length = 100
exclude = ["spike"]
